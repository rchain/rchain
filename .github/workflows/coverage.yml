# Test + audit gate + coverage gate.
#
# Runs the full test suite (excluding the flaky crypto crate), the type-system audit gate, and
# cargo-llvm-cov with a minimum line-coverage threshold. Raise the threshold as coverage improves.

name: test & coverage

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Type-system audit gate
        run: tools/audit-type-system.sh

      - name: Test
        run: cargo test --workspace --exclude rchain-crypto

      - name: Coverage
        run: cargo llvm-cov --workspace --exclude rchain-crypto --lcov --output-path lcov.info --fail-under-lines 50

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
