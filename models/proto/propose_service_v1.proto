// Vendored, scalapb-stripped copy of models/src/main/protobuf/ProposeServiceV1.proto.
syntax = "proto3";

package casper;

import "service_error.proto";
import "propose_service_common.proto";

service ProposeService {
  rpc propose(ProposeQuery) returns (ProposeResponse) {}
  rpc proposeResult(ProposeResultQuery) returns (ProposeResultResponse) {}
}

message ProposeResponse {
  oneof message {
    ServiceError error = 1;
    string result = 2;
  }
}

message ProposeResultResponse {
  oneof message {
    ServiceError error = 1;
    string result = 2;
  }
}
